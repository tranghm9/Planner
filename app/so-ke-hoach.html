<title>Sổ Kế Hoạch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: a pink lined-paper notebook. Hand-drawn ink cards; sidebar on wide screens, bottom bar on phones. */
:root{
  --bg:#FCEFF3; --rule:rgba(214,120,150,.16); --surface:#FFFFFF; --sunken:#FFF6F8; --ink:#3B2530; --muted:#86636F; --line:#F1D3DD; --pen:#4A2C3A;
  --rose:#C9517B; --rose-ink:#FFFFFF; --rose-soft:#FCE1EA; --rose-mid:#F4B6CA;
  --s1:#D0557E; --s2:#5B6FD6; --ok:#2F8F6B; --ok-soft:#DDF3EA; --danger:#C83A3A; --danger-soft:#FBE2E0; --gold:#B87A0A; --gold-soft:#FFF0CC;
  --h0:#FBEFF3; --h1:#F8D3DF; --h2:#F0A9C0; --h3:#E07A9E; --h4:#B9466F;
  --shadow:0 2px 0 rgba(74,44,58,.08);
  --display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif; --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sk:18px 22px 16px 24px/22px 16px 24px 18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-mode="light"]){
  --bg:#1C1317; --rule:rgba(255,170,200,.05); --surface:#271B21; --sunken:#21171C; --ink:#F7E7ED; --muted:#C2A2AF; --line:#3E2A33; --pen:#E8C3D2;
  --rose:#F09AB8; --rose-ink:#2B0F1B; --rose-soft:#3A2430; --rose-mid:#6B3550;
  --s1:#D86A90; --s2:#7A86E0; --ok:#5FC79D; --ok-soft:#1E3A2F; --danger:#F07C74; --danger-soft:#3B1F1E; --gold:#F2C14E; --gold-soft:#3A2F17;
  --h0:#2A1D23; --h1:#4A2A38; --h2:#7A3A55; --h3:#B05077; --h4:#E880A6; --shadow:0 2px 0 rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]:not([data-mode="light"]),:root[data-mode="dark"]{
  --bg:#1C1317; --rule:rgba(255,170,200,.05); --surface:#271B21; --sunken:#21171C; --ink:#F7E7ED; --muted:#C2A2AF; --line:#3E2A33; --pen:#E8C3D2;
  --rose:#F09AB8; --rose-ink:#2B0F1B; --rose-soft:#3A2430; --rose-mid:#6B3550;
  --s1:#D86A90; --s2:#7A86E0; --ok:#5FC79D; --ok-soft:#1E3A2F; --danger:#F07C74; --danger-soft:#3B1F1E; --gold:#F2C14E; --gold-soft:#3A2F17;
  --h0:#2A1D23; --h1:#4A2A38; --h2:#7A3A55; --h3:#B05077; --h4:#E880A6; --shadow:0 2px 0 rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  background-image:repeating-linear-gradient(90deg,var(--rule) 0 1px,transparent 1px 30px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 104px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;font-family:var(--display);text-wrap:balance;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}

/* shell */
.shell{max-width:1240px;margin:0 auto}
.side{display:none}
.main{min-width:0;display:flex;flex-direction:column;gap:18px}
#view{display:flex;flex-direction:column;gap:18px;min-width:0}
@media (min-width:960px){
  body{padding-bottom:40px}
  .shell{display:grid;grid-template-columns:236px minmax(0,1fr);gap:28px}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;margin-top:16px;
    background:var(--surface);border:2px solid var(--pen);border-radius:var(--sk);padding:16px 12px;max-height:calc(100vh - 32px);overflow:auto}
  .bottom{display:none!important}
  .top .brand{display:none}
}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.01em;color:var(--ink);padding:2px 6px 10px}
.logo{width:34px;height:34px;flex:none;border-radius:10px 12px 9px 13px;background:var(--rose);border:2px solid var(--pen);display:grid;place-items:center;transform:rotate(-4deg)}
.logo svg{width:20px;height:20px;color:var(--rose-ink)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:10px;font-weight:500;font-size:14.5px;color:var(--ink);text-align:left}
.nav button svg{width:19px;height:19px;flex:none;color:var(--muted)}
.nav button:hover{background:var(--sunken)}
.nav button[aria-current="page"]{background:var(--rose-soft);font-weight:600;box-shadow:inset 0 0 0 2px var(--pen)}
.nav button[aria-current="page"] svg{color:var(--rose)}
.nav .badge,.bottom .badge{margin-left:auto;background:var(--gold);color:#241500;font-size:11px;font-weight:700;border-radius:9px;padding:0 6px;min-width:18px;text-align:center}
.side-foot{margin-top:auto;padding-top:12px;display:flex;flex-direction:column;gap:10px}

/* top header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:16px}
.top .ttl{min-width:0}
.top h1{font-size:28px;font-weight:800}
.top .sub{font-size:13px;color:var(--muted)}
.top .brand{padding:0;font-size:20px}

/* bottom bar */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:2px solid var(--pen);
  padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.bottom button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;color:var(--muted);padding:5px 2px;border-radius:12px;position:relative;min-width:0}
.bottom button svg{width:22px;height:22px}
.bottom button[aria-current="page"]{color:var(--ink);font-weight:600;background:var(--rose-soft)}
.bottom .badge{position:absolute;top:0;left:calc(50% + 6px);margin:0}

/* sketch cards */
.card{position:relative;background:var(--surface);border:2px solid var(--pen);border-radius:var(--sk);padding:16px;box-shadow:var(--shadow);min-width:0}
.card.sk::after{content:"";position:absolute;inset:-4px -2px -2px -4px;border:1.5px solid var(--pen);border-radius:22px 16px 24px 18px/16px 24px 18px 22px;opacity:.35;transform:rotate(-.35deg);pointer-events:none}
.card.soft{border-color:var(--line);box-shadow:none}
.card.pink{background:var(--rose-soft)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.card-h h2{font-size:19px;font-weight:700}
.card-h .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.empty{padding:16px;border:2px dashed var(--line);border-radius:14px;color:var(--muted);font-size:14px;text-align:center}
.sec-label{font-family:var(--display);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}

/* buttons */
.btn{border:2px solid var(--pen);background:var(--surface);border-radius:12px 14px 11px 15px;padding:7px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:14px;line-height:1.3}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--rose);color:var(--rose-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding-inline:8px}
.btn.ghost:hover{color:var(--ink);background:var(--sunken)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:2px solid var(--pen);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:4px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--rose);color:var(--rose-ink)}
.navpill{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.navpill .btn{padding:4px 10px}

/* capture */
.cap{display:flex;flex-direction:column;gap:10px}
.cap textarea{width:100%;min-height:86px;resize:vertical;border:2px dashed var(--line);border-radius:14px;padding:12px;background:var(--sunken);line-height:1.5}
.cap textarea:focus{outline:none;border-color:var(--rose)}
.cap .tools{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:64px;height:64px;border-radius:12px;overflow:hidden;border:2px solid var(--pen)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;padding:0}
.partial{font-size:13px;color:var(--rose)}
.busy{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--rose);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.mic.on{background:var(--danger-soft);color:var(--danger)}

/* day hero */
.hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hero .txt{flex:1;min-width:180px}
.hero h2{font-size:22px}
.ring{flex:none;position:relative;display:grid;place-items:center}
.ring svg{display:block}
.ring b{position:absolute;font-family:var(--display);font-weight:800;color:var(--ink)}

/* task rows */
.list{display:flex;flex-direction:column}
.task{display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:10px;padding:9px 2px;border-top:1.5px dashed var(--line);min-width:0}
.list>.task:first-child{border-top:0}
.task.timed{grid-template-columns:44px auto 1fr auto}
.when{font-size:13px;font-weight:600;color:var(--muted);padding-top:2px}
.when.soon{color:var(--rose)}
.check{width:22px;height:22px;border-radius:6px 7px 5px 8px;border:2px solid var(--pen);background:var(--surface);padding:0;margin-top:1px;display:grid;place-items:center;flex:none;box-shadow:inset 0 -3px 0 color-mix(in srgb,var(--c,var(--rose)) 45%,transparent)}
.check:hover{background:var(--rose-soft)}
.check[aria-checked="true"]{background:var(--ok);border-color:var(--ok);box-shadow:none}
.check[aria-checked="true"]::after{content:"";width:10px;height:5px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.tbody{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.ttl{font-weight:500;overflow-wrap:anywhere}
.meta{display:flex;gap:5px 9px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;border-radius:8px}
.x:hover{color:var(--danger);background:var(--danger-soft)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:0 8px;border-radius:99px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ink)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.pill{font-size:11.5px;font-weight:600;padding:0 7px;border-radius:7px;white-space:nowrap}
.pill.urgent{background:var(--danger);color:#fff}
.pill.high{background:var(--gold-soft);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--gold)}
.pill.late{background:var(--danger-soft);color:var(--danger)}
.pill.auto{background:var(--rose-soft);color:var(--rose)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.ex{background:var(--sunken);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.pill.wait{background:var(--gold-soft);color:var(--gold)}
.notes-snip{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.now{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:11.5px;font-weight:700;color:var(--rose)}
.now::after{content:"";flex:1;height:2px;background:var(--rose);border-radius:2px}
.add{display:flex;gap:6px;margin-top:10px}
.add input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:7px 11px;background:var(--sunken)}
.add input:focus{outline:none;border-color:var(--rose)}
.add button{border:2px solid var(--pen);background:var(--rose);color:var(--rose-ink);border-radius:10px 12px 9px 13px;width:38px;font-size:20px;font-weight:700;line-height:1}

/* review */
.review{background:var(--gold-soft)}
.rv{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1.5px dashed color-mix(in srgb,var(--gold) 45%,transparent)}
.rv:first-of-type{border-top:0;padding-top:2px}
.rv .why{font-size:12.5px;color:var(--muted)}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choice{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 11px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.choice::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.choice:hover{border-color:var(--pen)}
.choice.sug{border:2px solid var(--pen);font-weight:600}
.choice.sug::after{content:"gợi ý";font-size:10.5px;font-weight:700;color:var(--rose);text-transform:uppercase;letter-spacing:.06em}
.choice.new{border-style:dashed}

/* habits today */
.hab{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1.5px dashed var(--line)}
.hab:first-child{border-top:0}
.hab span{flex:1;min-width:0}
.hab.done span{text-decoration:line-through;color:var(--muted)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding-bottom:2px}
.day{border:1.5px solid transparent;background:none;border-radius:12px;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px;min-width:0}
.day:hover{background:var(--sunken)}
.day .d{font-weight:700;font-size:15px;line-height:1.2}
.day .l{font-size:10px;color:var(--muted);line-height:1}
.day.out{opacity:.38}
.day.today{background:var(--rose-soft)}
.day[aria-pressed="true"]{background:var(--rose);color:var(--rose-ink);border-color:var(--pen)}
.day[aria-pressed="true"] .l{color:var(--rose-ink)}
.dots{display:flex;gap:2px;align-items:center;font-size:9.5px;color:inherit;opacity:.85}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}

/* week columns */
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}
.wcol .card-h{margin-bottom:4px}
.wcol h3{font-size:16px}
.wcol.is-today{background:var(--rose-soft)}
.date-tag{font-size:11.5px;font-weight:700;padding:0 8px;border-radius:99px;background:var(--ok-soft);color:var(--ok)}
.is-today .date-tag{background:var(--rose);color:var(--rose-ink)}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.kpi{display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .lbl{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:var(--display);font-size:26px;font-weight:800;line-height:1.1;overflow-wrap:anywhere}
.kpi .val small{font-size:14px;font-weight:600;color:var(--muted)}
.kpi .d{font-size:12.5px;color:var(--muted)}
.up{color:var(--ok)} .down{color:var(--danger)}
.big{font-family:var(--display);font-size:52px;font-weight:800;line-height:1}
.plot{width:100%;min-height:40px}
.plot svg{display:block;overflow:visible}
.plot .col .xh{opacity:0}
.plot .col:hover .xh{opacity:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;background:var(--c)}
.tbl-wrap{overflow-x:auto;max-width:100%}
table.tbl{border-collapse:collapse;font-size:13px;min-width:100%}
table.tbl th,table.tbl td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.tbl th:first-child,table.tbl td:first-child{text-align:left}
table.tbl th{font-weight:600;color:var(--muted)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,22px);grid-auto-columns:22px;gap:4px;overflow-x:auto;padding-bottom:4px}
.heat i{border-radius:6px;background:var(--h0)}
.heat .wl{font-size:11px;color:var(--muted);display:flex;align-items:center;font-style:normal;background:none}
.heat-legend{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-top:8px}
.heat-legend i{width:14px;height:14px;border-radius:4px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:68px 1fr 36px;align-items:center;gap:10px;font-size:13px}
.bar .tr{height:14px;background:var(--sunken);border-radius:4px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.bar b{text-align:right;font-weight:600}

/* habits grid */
.hgrid{border-collapse:separate;border-spacing:3px;font-size:12px}
.hgrid th{font-weight:600;color:var(--muted);text-align:center;padding:0 1px;line-height:1.2}
.hgrid th.today{color:var(--rose)}
.hgrid td.nm{position:sticky;left:0;background:var(--surface);z-index:1;min-width:150px;max-width:190px;padding-right:8px}
.hgrid td.nm div{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:600;font-size:13px}
.hgrid td.nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hgrid .pb{height:4px;background:var(--line);border-radius:3px;margin-top:4px}
.hgrid .pb i{display:block;height:100%;background:var(--ok);border-radius:3px}
.hc{width:24px;height:24px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);padding:0;display:grid;place-items:center}
.hc[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.hc[aria-checked="true"]::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.hc.today{border-color:var(--rose);border-width:2px}
.hc:disabled{opacity:.35;cursor:default}

/* goals */
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.goal{display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer}
.goal .gt{display:flex;gap:8px;align-items:flex-start}
.goal .gt b{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.goal.done .gt b{text-decoration:line-through;color:var(--muted)}
.prog{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--sunken);border:1.5px solid var(--line)}

/* year */
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:10px}
.month{padding:10px 12px}
.month .mh{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;border:0;background:none;padding:0;font-weight:700;font-family:var(--display);font-size:15px;text-align:left}
.month .mh small{font-family:var(--font);font-weight:600;font-size:12px;color:var(--muted)}
.month.cur{background:var(--rose-soft)}
.month .prog{margin-top:6px}
.field{width:100%;border:2px solid var(--line);border-radius:12px;padding:8px 11px;background:var(--sunken)}
.field:focus{outline:none;border-color:var(--rose)}

/* categories */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cat{border:2px solid var(--line);border-radius:14px;background:var(--surface);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}

.cat .nm{font-weight:600;display:flex;align-items:center;gap:8px}
.cat .nm::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}

.ldots{display:inline-flex;gap:3px;vertical-align:middle;margin-right:4px}
.ldots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.ldots i.on{background:var(--rose)}

.sheet .pane{background:var(--surface);width:100%;max-width:580px;max-height:92%;overflow:auto;border:2px solid var(--pen);border-bottom:0;border-radius:22px 22px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:760px){.sheet{align-items:center}.sheet .pane{border-radius:var(--sk);border-bottom:2px solid var(--pen)}}
.sheet h3{font-size:20px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label,.f .lb{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--sunken);width:100%;min-width:0}
.f textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wdays{display:flex;gap:4px;flex-wrap:wrap}
.wdays button{width:38px;height:32px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600}
.wdays button[aria-pressed="true"]{background:var(--rose);color:var(--rose-ink);border-color:var(--pen)}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:8px;align-items:center}
.step input[type="text"]{flex:1;min-width:0;border:2px solid var(--line);border-radius:10px;padding:6px 9px;background:var(--sunken)}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1.5px dashed var(--line);flex-wrap:wrap}
.set:first-of-type{border-top:0}
.set .lbl{min-width:0;flex:1 1 240px}
.set .lbl b{display:block;font-weight:600}
.set .lbl span{font-size:13px;color:var(--muted)}
.switch{width:46px;height:28px;border-radius:99px;border:2px solid var(--pen);background:var(--line);position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:left .15s;box-shadow:0 0 0 1.5px var(--pen)}
.switch[aria-checked="true"]{background:var(--rose)}
.switch[aria-checked="true"]::after{left:20px}
.guide{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:var(--surface);border:2px dashed var(--line);font-size:13.5px}
.more{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.more button{display:flex;align-items:center;gap:10px;padding:14px;border:2px solid var(--pen);border-radius:var(--sk);background:var(--surface);font-weight:600;text-align:left}
.more button svg{width:22px;height:22px;color:var(--rose);flex:none}
.meter{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.meter .mb{height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.meter .mb i{display:block;height:100%;background:var(--rose);border-radius:9px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:14px;font-size:14px;max-width:min(92vw,520px);display:flex;gap:12px;align-items:center}
#toast button{border:0;background:none;color:var(--rose-mid);font-weight:700;padding:0}
@media (min-width:960px){#toast{bottom:24px}}
#tip{position:fixed;z-index:70;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:9px;max-width:240px;white-space:pre-line;line-height:1.35}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>

const isoWeek = d => { const x = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = x.getUTCDay() || 7; x.setUTCDate(x.getUTCDate() + 4 - day); const y0 = new Date(Date.UTC(x.getUTCFullYear(), 0, 1)); return Math.ceil(((x - y0) / 864e5 + 1) / 7); };

/* ================= lunar calendar (Ho Ngoc Duc, UTC+7) ================= */

const CAN=['Canh','Tân','Nhâm','Quý','Giáp','Ất','Bính','Đinh','Mậu','Kỷ'], CHI=['Thân','Dậu','Tuất','Hợi','Tý','Sửu','Dần','Mão','Thìn','Tỵ','Ngọ','Mùi'];
const lunarLabel = d => { const l = lunar(d); return l.d === 1 ? `mùng 1/${l.m}` : l.d === 15 ? `rằm tháng ${l.m}` : `${l.d}/${l.m}${l.leap ? ' nhuận' : ''}`; };
const lunarShort = d => { const l = lunar(d); return l.d === 1 ? `1/${l.m}` : String(l.d); };

/* ================= defaults ================= */
const DEFAULT_CATS = [
  {id:'work',     name:'Công việc',  color:'#3F77C4', desc:'việc cơ quan, dự án, họp, báo cáo, khách hàng, đồng nghiệp'},
  {id:'money',    name:'Tài chính',  color:'#D0802A', desc:'hóa đơn, thẻ tín dụng, khoản vay, trả nợ, chuyển khoản, đóng tiền, bảo hiểm'},
  {id:'family',   name:'Gia đình',   color:'#D2557F', desc:'con cái, vợ/chồng, bố mẹ, họ hàng, việc nhà, giỗ, cúng'},
  {id:'health',   name:'Sức khỏe',   color:'#2E9A6A', desc:'khám bệnh, uống thuốc, tập luyện, tiêm, nha khoa'},
  {id:'learn',    name:'Học tập',    color:'#8559C9', desc:'khóa học, đọc sách, bài tập, thi cử, kỹ năng mới'},
  {id:'shop',     name:'Mua sắm',    color:'#B8860B', desc:'mua đồ, đặt hàng, đi chợ, nhận hàng'},
  {id:'personal', name:'Cá nhân',    color:'#1F8A99', desc:'bạn bè, sở thích, giấy tờ cá nhân, chăm sóc bản thân'},
  {id:'other',    name:'Khác',       color:'#8C7B83', desc:'những việc chưa rõ thuộc nhóm nào'}
];
const DEFAULT_AREAS = [
  {id:'health',name:'Sức khỏe'},{id:'money',name:'Tài chính'},{id:'career',name:'Sự nghiệp'},{id:'growth',name:'Phát triển'},
  {id:'relation',name:'Quan hệ'},{id:'study',name:'Học tập'},{id:'family',name:'Gia đình'},{id:'hobby',name:'Sở thích'}
];
const EXTRA_COLORS = ['#A0522D','#3B7D23','#B03A9A','#4A6FA5','#8C6D1F','#C0392B','#16807A','#6B5BA8'];
const DEFAULT_SETTINGS = { categories: DEFAULT_CATS, areas: DEFAULT_AREAS, examples: [], stats: {}, alwaysAsk: false, remind: 30,
  dayStart: '07:30', dayEnd: '22:00', welcomed: false, theme: 'system', sound: true, nudge: '21:00' };
const PRI = { urgent: 0, high: 1, medium: 2, low: 3 };
const PRI_LBL = { urgent: 'Gấp', high: 'Quan trọng', medium: 'Bình thường', low: 'Thấp' };
const REPEAT_LBL = { daily: 'hằng ngày', weekly: 'hằng tuần', monthly: 'hằng tháng' };

/* ================= state ================= */
const S = { tasks: new Map(), habits: new Map(), goals: new Map(), years: new Map(), settings: clone(DEFAULT_SETTINGS),
  view: 'today', sel: today(), calMonth: null, weekStart: null, habitMonth: null, year: new Date().getFullYear(), statsWeeks: 8,
  chartMode: {}, openMonth: new Date().getMonth() + 1, catFilter: null, images: [], plan: null,
  mode: 'local', loading: true, busy: false, readOnly: false };
const AI = { sample: null, images: false, imgMax: 0, dict: null, downloads: null, dictLang: 'vi' };

/* ================= theme ================= */
const THEME_LBL = { light: 'Sáng', dark: 'Tối', system: 'Theo hệ thống' };
function applyTheme() {
  const m = S.settings.theme, r = document.documentElement;
  if (m === 'light' || m === 'dark') r.setAttribute('data-mode', m); else r.removeAttribute('data-mode');

    : m === 'light' ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>';

/* ================= storage: claude db or this device ================= */
let db = null;
const LS_KEY = 'so-ke-hoach-v2';
const COLLS = ['tasks', 'habits', 'goals', 'years'];
const writers = new Map();
function queueWrite(key, fn) { let w = writers.get(key); if (!w) { w = { running: false, next: null }; writers.set(key, w); } w.next = fn; if (!w.running) drain(w); }
async function drain(w) {
  w.running = true;
  while (w.next) { const f = w.next; w.next = null;
    try { await f(); } catch (e) {
      if (e && e.code === 'invalid_argument' && !S.readOnly) { S.readOnly = true; toast('Bạn chỉ có quyền xem sổ này, thay đổi không được lưu.'); }

function saveLocal() { try { const o = { settings: S.settings }; COLLS.forEach(c => o[c] = [...S[c].values()]); localStorage.setItem(LS_KEY, JSON.stringify(o)); } catch {} }
function loadLocal() {
  try {
    let o = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (!o) { const old = JSON.parse(localStorage.getItem('so-ke-hoach-v1') || 'null'); if (old) o = { tasks: old.tasks, settings: old.settings }; }
    if (o) { COLLS.forEach(c => (o[c] || []).forEach(x => x && x.id && S[c].set(x.id, x))); S.settings = mergeSettings(Object.assign({}, o.settings, { theme: S.settings.theme })); }

function mergeSettings(s) {
  const o = Object.assign(clone(DEFAULT_SETTINGS), s || {});

  if (!Array.isArray(o.areas) || !o.areas.length) o.areas = clone(DEFAULT_AREAS);

}
function put(coll, obj) {
  obj.updatedAt = Date.now(); S[coll].set(obj.id, obj);

function ingest(items, sourceText) {
  let auto = 0, ask = 0;
  for (const it of items) {
    if (!it || typeof it !== 'object') continue;
    const title = String(it.title || '').trim().slice(0, 120); if (!title) continue;
    let cat = String(it.category || ''), newCat = null;
    if (!catById(cat)) { if (cat === 'NEW' && it.newCategoryName) newCat = String(it.newCategoryName).trim().slice(0, 30) || null; cat = catById(it.fallbackCategory) ? it.fallbackCategory : 'other'; }
    const conf = clamp(Number(it.confidence) || 0, 0, 1);
    const isAuto = !S.settings.alwaysAsk && !newCat && learnedCount(cat) >= LEARN_N && conf >= 0.8;
    const repeat = REPEAT_LBL[it.repeat] ? it.repeat : 'none';
    const days = repeat === 'weekly' && Array.isArray(it.days) ? [...new Set(it.days.map(Number).filter(n => n >= 0 && n <= 6))] : [];
    let date = RE_DATE.test(it.date || '') ? it.date : null;
    if (repeat !== 'none' && !date) date = today();
    const t = newTask({
      title, notes: String(it.notes || '').slice(0, 2000), cat, date, time: RE_TIME.test(it.time || '') ? it.time : null,
      duration: clamp(Math.round(Number(it.duration) || 30), 5, 480),
      remind: Number.isFinite(Number(it.remindMinutes)) ? clamp(Math.round(Number(it.remindMinutes)), 0, 10080) : S.settings.remind,
      priority: PRI[it.priority] !== undefined ? it.priority : 'medium', repeat, days,
      status: isAuto ? 'open' : 'review', auto: isAuto, aiConf: conf, aiReason: String(it.reason || '').slice(0, 200), newCat,
      source: String(sourceText || '').slice(0, 300)
    });
    put('tasks', t); isAuto ? auto++ : ask++;

}

function guessCat(s) {

function go(v) { S.view = v; S.plan = S.plan && S.plan.loading ? S.plan : null; closeSheet(); render(); window.scrollTo(0, 0); }

function taskRow(t, ds, opt = {}) {
  const c = catOf(t), tdy = today(), done = isDoneOn(t, ds), review = t.status === 'review';
  const late = !done && !isRep(t) && t.date && (t.date < tdy || (t.date === tdy && t.time && t.time < nowHM()));
  let soon = false; if (!done && ds === tdy && t.time) { const mins = (startOf({ date: ds, time: t.time }) - new Date()) / 60000; soon = mins >= 0 && mins <= 60; }
  const meta = [];
  if (opt.showDate && t.date) meta.push(`<span class="num">${esc(fmtDate(t.date))}${t.time ? ' · ' + t.time : ''}</span>`);
  else if (!opt.timed && t.time) meta.push(`<span class="num">${t.time}</span>`);
  if (!opt.compact) meta.push(`<span class="chip" style="--c:${esc(c.color)}">${esc(c.name)}</span>`);
  if (t.priority === 'urgent') meta.push('<span class="pill urgent">Gấp</span>'); else if (t.priority === 'high') meta.push('<span class="pill high">Quan trọng</span>');
  if (review) meta.push('<span class="pill wait">chờ phân loại</span>');
  if (late && !opt.compact) meta.push('<span class="pill late">Trễ hạn</span>');
  if (isRep(t)) meta.push(`<span title="Lặp lại">↻ ${t.repeat === 'weekly' && t.days && t.days.length ? [...t.days].sort((a, b) => (a || 7) - (b || 7)).map(d => WDS[d]).join(', ') : REPEAT_LBL[t.repeat]}</span>`);
  if (t.steps && t.steps.length) meta.push(`<span class="num">${t.steps.filter(s => s.done).length}/${t.steps.length} bước</span>`);
  if (t.auto && !done && !opt.compact) meta.push('<span class="pill auto" title="App tự phân loại dựa trên những gì bạn đã dạy">tự xếp</span>');
  if (t.isExample) meta.push('<span class="pill ex">ví dụ</span>');
  return `<div class="task${done ? ' done' : ''}${opt.timed ? ' timed' : ''}" data-id="${esc(t.id)}" data-date="${esc(ds || '')}">
    ${opt.timed ? `<span class="when num${soon ? ' soon' : ''}">${t.time || '—'}</span>` : ''}
    <button class="check" role="checkbox" aria-checked="${done}" style="--c:${esc(c.color)}" data-act="done" aria-label="${esc(t.title)}"></button>
    <button class="tbody" data-act="edit"><span class="ttl">${esc(t.title)}</span>${meta.length ? `<span class="meta">${meta.join('')}</span>` : ''}${t.notes && !opt.compact ? `<span class="notes-snip">${esc(t.notes)}</span>` : ''}</button>
    <button class="x" data-act="del-quick" aria-label="Xóa ${esc(t.title)}">×</button>
  </div>`;
}
const listHtml = (arr, ds, opt) => arr.length ? `<div class="list">${arr.map(t => taskRow(t, ds || t.date, opt)).join('')}</div>` : '';
const addForm = (kind, ph, extra = '') => `<form class="add" data-add="${kind}" ${extra}><input name="t" placeholder="${esc(ph)}" aria-label="${esc(ph)}" autocomplete="off"><button aria-label="Thêm">+</button></form>`;

    ${r.map(t => { const chips = cats().map(c => `<button class="choice${c.id === t.cat && !t.newCat ? ' sug' : ''}" style="--c:${esc(c.color)}" data-act="confirm" data-cat="${esc(c.id)}">${esc(c.name)}</button>`).join('');

function habitsTodayHtml() {
  const t = today(), hs = habits().filter(h => habitActive(h, t));

    ${hs.length ? `<div>${hs.map(h => { const d = habitDone(h, t); return `<div class="hab${d ? ' done' : ''}"><button class="check" role="checkbox" aria-checked="${d}" data-act="habit" data-id="${esc(h.id)}" data-date="${t}" aria-label="${esc(h.name)}"></button><span>${esc(h.name)}</span>${h.isExample ? '<span class="pill ex">ví dụ</span>' : ''}</div>`; }).join('')}</div>`
      : '<div class="empty">Chưa có thói quen nào. Thêm một thói quen nhỏ, ví dụ “Uống đủ 2 lít nước”.</div>'}

}
function greet() { const h = new Date().getHours(); return h < 11 ? 'Chào buổi sáng' : h < 14 ? 'Chào buổi trưa' : h < 18 ? 'Chào buổi chiều' : 'Chào buổi tối'; }

/* ================= views ================= */
function viewToday() {
  const t = today(), od = overdueTasks(), list = tasksOn(t).sort(byDay), inbox = undated(), dp = dayProgress();
  const timed = list.filter(x => x.time), untimed = list.filter(x => !x.time);
  let rows = ''; const now = nowHM(); let placed = false;
  for (const x of timed) { if (!placed && x.time > now) { rows += `<div class="now num">BÂY GIỜ ${now}</div>`; placed = true; } rows += taskRow(x, t, { timed: true }); }
  if (!placed && timed.length) rows += `<div class="now num">BÂY GIỜ ${now}</div>`;
  rows += untimed.map(x => taskRow(x, t, { timed: true })).join('');
  const msg = !dp.any ? 'Hôm nay chưa có gì. Ghi nhanh ở ô phía trên nhé.' : dp.p >= 100 ? 'Xong hết rồi! Một ngày thật trọn vẹn.' : dp.p >= 50 ? 'Đã qua nửa chặng, cố thêm chút nữa!' : 'Từng việc nhỏ một, bạn làm được.';
  return `${welcomeHtml()}${exampleBanner()}
    <section class="card sk hero"><div>${ring(dp.p, 92, 10)}</div><div class="txt"><h2>${greet()}!</h2>
      <p class="hint num" style="font-size:14px">${dp.done}/${dp.total} việc · ${dp.hd}/${dp.ht} thói quen hôm nay</p><p style="margin:4px 0 0">${msg}</p></div></section>
    ${reviewHtml()}
    ${od.length ? `<section class="card sk"><div class="card-h"><h2 style="color:var(--danger)">Việc còn tồn</h2><button class="btn sm" data-act="move-overdue">Chuyển hết vào hôm nay</button></div>${listHtml(od, null, { showDate: true })}</section>` : ''}
    <div class="grid2">
      <section class="card sk"><div class="card-h"><h2>Việc hôm nay</h2><button class="btn sm" data-act="plan"${AI.sample ? '' : ' disabled title="Cần AI"'}>Xếp lịch giúp tôi</button></div>
        ${planHtml()}${rows ? `<div class="list">${rows}</div>` : '<div class="empty">Chưa có việc nào cho hôm nay.</div>'}
        ${addForm('task', 'Thêm việc cho hôm nay…', `data-date="${t}"`)}</section>
      ${habitsTodayHtml()}
    </div>
    ${inbox.length ? `<section class="card sk"><div class="card-h"><h2>Chưa có ngày</h2><span class="muted num">${inbox.length} việc</span></div>${listHtml(inbox.slice(0, 8), null, {})}${inbox.length > 8 ? `<button class="btn ghost sm" data-go="cal">Xem tất cả</button>` : ''}</section>` : ''}`;
}
function viewCal() {
  const m0 = S.calMonth || new Date(new Date().getFullYear(), new Date().getMonth(), 1); S.calMonth = m0;
  const first = monday(m0), t = today(); let cells = ['T2','T3','T4','T5','T6','T7','CN'].map(w => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < 42; i++) { const d = addDays(first, i), ds = ymd(d); if (i % 7 === 0 && i >= 28 && d.getMonth() !== m0.getMonth()) break;
    const items = tasksOn(ds), dots = items.slice(0, 3).map(x => `<i style="--c:${esc(catOf(x).color)}"></i>`).join('') + (items.length > 3 ? `+${items.length - 3}` : '');
    cells += `<button class="day${d.getMonth() !== m0.getMonth() ? ' out' : ''}${ds === t ? ' today' : ''}" aria-pressed="${ds === S.sel}" data-act="sel-day" data-date="${ds}" aria-label="${esc(WD[d.getDay()] + ' ' + dmY(d) + ', ' + items.length + ' việc')}"><span class="d num">${d.getDate()}</span><span class="l">${esc(lunarShort(d))}</span><span class="dots">${dots}</span></button>`; }
  const sel = parseYmd(S.sel), selItems = tasksOn(S.sel).sort(byDay);
  const up = []; for (let i = 1; i <= 14; i++) { const ds = ymd(addDays(new Date(), i)); const it = tasksOn(ds).filter(x => !isDoneOn(x, ds)); if (it.length) up.push([ds, it]); }
  const inbox = undated();
  return `<section class="card sk"><div class="card-h"><h2>Lên kế hoạch</h2><div class="navpill"><button class="btn" data-act="cal-prev" aria-label="Tháng trước">‹</button><b class="num">Tháng ${m0.getMonth() + 1}/${m0.getFullYear()}</b><button class="btn" data-act="cal-next" aria-label="Tháng sau">›</button><button class="btn sm" data-act="cal-today">Hôm nay</button></div></div>
    <div class="cal">${cells}</div><p class="hint" style="margin-top:8px">Số nhỏ dưới mỗi ngày là ngày âm lịch. Chấm màu là việc trong ngày theo danh mục.</p></section>
    <section class="card sk"><div class="card-h"><h2>${esc(fmtDate(S.sel))}</h2><span class="muted num">${dmY(sel)} · âm lịch ${esc(lunarLabel(sel))}</span></div>
      ${selItems.length ? listHtml(selItems, S.sel, { timed: true }) : '<div class="empty">Ngày này chưa có việc nào.</div>'}
      ${addForm('task', 'Thêm việc cho ngày này…', `data-date="${S.sel}"`)}</section>
    <section class="card sk"><div class="card-h"><h2>14 ngày tới</h2><button class="btn sm" data-act="ics-all">Tải nhắc hẹn vào lịch điện thoại</button></div>
      ${up.length ? up.map(([ds, it]) => `<p class="sec-label" style="margin-top:10px">${esc(fmtDate(ds))} · âm ${esc(lunarLabel(parseYmd(ds)))}</p>${listHtml(it.sort(byDay), ds, {})}`).join('') : '<div class="empty">Chưa có việc nào trong 2 tuần tới.</div>'}</section>
    ${inbox.length ? `<section class="card sk"><div class="card-h"><h2>Chưa có ngày</h2><span class="muted num">${inbox.length} việc</span></div>${listHtml(inbox, null, {})}</section>` : ''}`;
}
function viewWeek() {
  const ws = S.weekStart || monday(new Date()); S.weekStart = ws;
  const days = Array.from({ length: 7 }, (_, i) => ymd(addDays(ws, i))), t = today(), end = days[6] < t ? days[6] : t;
  const prevDays = days.map(d => ymd(addDays(parseYmd(d), -7)));
  const cnt = days.map(dayCount), pc = prevDays.map(dayCount);
  const done = cnt.reduce((a, c) => a + c.done, 0), total = cnt.reduce((a, c) => a + c.total, 0), pdone = pc.reduce((a, c) => a + c.done, 0);
  const hr = days[0] <= t ? habitRate(days[0], end) : { rate: 0, total: 0 }, phr = habitRate(prevDays[0], prevDays[6]);
  const best = cnt.reduce((b, c, i) => c.done > b.v ? { v: c.done, i } : b, { v: 0, i: -1 });
  const notes = [];
  if (days[0] <= t) {
    notes.push(done >= pdone ? `Xong nhiều hơn tuần trước ${done - pdone} việc.` : `Xong ít hơn tuần trước ${pdone - done} việc, thử chia nhỏ việc để dễ hoàn thành hơn.`);
    if (hr.total && phr.total) notes.push(hr.rate >= phr.rate ? `Thói quen tăng ${hr.rate - phr.rate} điểm so với tuần trước.` : `Thói quen giảm ${phr.rate - hr.rate} điểm so với tuần trước, hãy tích đều hơn.`);
    if (best.i >= 0) notes.push(`Ngày hiệu quả nhất: ${WD[parseYmd(days[best.i]).getDay()]} (${best.v} việc xong).`);
  }
  const ti = days.indexOf(t);
  const spec = { labels: days.map(d => WDS[parseYmd(d).getDay()]), full: days.map(d => fmtDate(d)), xName: 'Ngày', hl: ti, endIdx: ti >= 0 ? ti : 6,
    series: [{ name: 'Đã xong', color: '--s1', values: cnt.map(c => c.done) }, { name: 'Tổng việc', color: '--s2', values: cnt.map(c => c.total) }],
    tip: i => `${fmtDate(days[i])}: ${cnt[i].done}/${cnt[i].total} việc xong`, aria: 'Tiến độ từng ngày trong tuần' };
  return `<section class="card sk"><div class="card-h"><div><h2>Tuần ${isoWeek(ws)} · ${dm(ws)}–${dmY(addDays(ws, 6))}</h2></div>
      <div class="navpill"><button class="btn" data-act="wk-prev" aria-label="Tuần trước">‹</button><button class="btn sm" data-act="wk-now">Tuần này</button><button class="btn" data-act="wk-next" aria-label="Tuần sau">›</button></div></div>
    <div class="kpis"><div class="kpi"><span class="lbl">Đã xong</span><span class="val num">${done}<small>/${total}</small></span></div>
      <div class="kpi"><span class="lbl">Thói quen</span><span class="val num">${hr.rate}%</span></div>
      <div class="kpi"><span class="lbl">Hôm nay</span><span class="val num">${dayCount(t).total}<small> việc</small></span></div></div>
    ${notes.length ? `<p style="margin:12px 0 0"><b>${done >= pdone ? 'Khá tốt, giữ nhịp này nhé.' : 'Tuần này hơi chậm một chút.'}</b><br><span class="muted">${esc(notes.join(' '))}</span></p>` : ''}</section>
    ${chartCard('week', 'Tiến độ từng ngày', spec)}
    <p class="sec-label">Công việc trong tuần</p>
    <div class="week">${days.map(ds => { const d = parseYmd(ds), it = tasksOn(ds).sort(byDay);
      return `<section class="card sk wcol${ds === t ? ' is-today' : ''}"><div class="card-h"><h3>${WD[d.getDay()]}</h3><span class="date-tag num">${dm(d)}</span></div>
        ${it.length ? listHtml(it, ds, { compact: true }) : '<p class="hint">Trống</p>'}${addForm('task', 'Thêm việc…', `data-date="${ds}"`)}</section>`; }).join('')}</div>`;
}
function viewHabits() {
  const m0 = S.habitMonth || new Date(new Date().getFullYear(), new Date().getMonth(), 1); S.habitMonth = m0;
  const y = m0.getFullYear(), m = m0.getMonth(), nd = new Date(y, m + 1, 0).getDate(), t = today();
  const days = Array.from({ length: nd }, (_, i) => ymd(new Date(y, m, i + 1))), hs = habits();
  let tDone = 0, tTot = 0, bestStreak = { n: 0, name: '' }, steady = { p: -1, name: '' };
  const rowsH = hs.map(h => { let d = 0, tot = 0, run = 0, br = 0;
    days.forEach(ds => { if (ds > t || !habitActive(h, ds)) { run = 0; return; } tot++; if (habitDone(h, ds)) { d++; run++; br = Math.max(br, run); } else run = 0; });
    tDone += d; tTot += tot; const p = pct(d, tot); if (br > bestStreak.n) bestStreak = { n: br, name: h.name }; if (tot && p > steady.p) steady = { p, name: h.name };
    return `<tr><td class="nm"><div><span title="${esc(h.name)}">${esc(h.name)}</span><span class="num muted">${p}%</span><button class="x" data-act="habit-del" data-id="${esc(h.id)}" aria-label="Xóa thói quen ${esc(h.name)}">×</button></div><div class="pb"><i style="width:${p}%"></i></div></td>
      ${days.map(ds => `<td><button class="hc${ds === t ? ' today' : ''}" role="checkbox" aria-checked="${habitDone(h, ds)}" data-act="habit" data-id="${esc(h.id)}" data-date="${ds}" ${ds > t || !habitActive(h, ds) ? 'disabled' : ''} aria-label="${esc(h.name + ' ngày ' + dm(parseYmd(ds)))}"></button></td>`).join('')}</tr>`; }).join('');
  const upto = days.filter(ds => ds <= t);
  const spec = { labels: upto.map(ds => String(parseYmd(ds).getDate())), full: upto.map(ds => fmtDate(ds)), xName: 'Ngày', hl: upto.indexOf(t),
    series: [{ name: 'Đã xong', color: '--s1', values: upto.map(ds => habitDay(ds).done) }, { name: 'Tổng thói quen', color: '--s2', values: upto.map(ds => habitDay(ds).total) }],
    tip: i => { const c = habitDay(upto[i]); return `${fmtDate(upto[i])}: ${c.done}/${c.total} thói quen`; }, aria: 'Mức hoàn thành thói quen theo ngày' };
  return `<section class="card sk"><div class="card-h"><div><h2>Theo dõi thói quen</h2><span class="hint">Tháng ${m + 1}/${y}</span></div>
      <div class="navpill"><button class="btn" data-act="hb-prev" aria-label="Tháng trước">‹</button><button class="btn sm" data-act="hb-now">Tháng này</button><button class="btn" data-act="hb-next" aria-label="Tháng sau">›</button></div></div>

      allTasks().filter(t => t.cat === cid).forEach(t => { t.cat = 'other'; put('tasks', t); });
      S.settings.categories = cats().filter(c => c.id !== cid); S.settings.examples = S.settings.examples.filter(x => x.c !== cid); delete S.settings.stats[cid];
      persistSettings(); S.catFilter = null; closeSheet(); render(); toast('Đã xóa danh mục, các việc chuyển sang “Khác”.'); break; }
    case 'theme': S.settings.theme = el.dataset.v; applyTheme(); persistSettings(); render(); break;
    case 'toggle-sound': S.settings.sound = !S.settings.sound; persistSettings(); render(); break;
    case 'toggle-ask': S.settings.alwaysAsk = !S.settings.alwaysAsk; persistSettings(); render(); break;
    case 'forget': if (confirmTwice(el, 'forget')) { S.settings.examples = []; S.settings.stats = {}; persistSettings(); render(); toast('App đã quên các lựa chọn cũ và sẽ hỏi lại bạn.'); } break;
    case 'ics-all': downloadIcs(allTasks().filter(t => t.status !== 'done'), 'so-ke-hoach.ics'); break;
    case 'ics-nudge': downloadIcs([nudgeTask()], 'nhac-mo-so-hang-ngay.ics'); break;
    case 'ics-one': { const f = $('#edit-form'), t = f && S.tasks.get(f.dataset.id); if (t) downloadIcs([t], 'nhac-hen.ics'); break; }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet();
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id === 'cap-text') analyze();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('goal')) { e.preventDefault(); editGoal(e.target.dataset.id); }
});
document.addEventListener('submit', e => {
  e.preventDefault(); const f = e.target;
  if (f.id === 'edit-form') return saveEdit(f);
  if (f.id === 'cat-form') return saveCategory(f);
  if (f.id === 'goal-form') return saveGoal();
  const kind = f.dataset.add; if (!kind) return; const v = f.querySelector('input').value.trim(); if (!v) return;
  const sel = `form.add[data-add="${kind}"]${f.dataset.date ? `[data-date="${f.dataset.date}"]` : ''}${f.dataset.m ? `[data-m="${f.dataset.m}"]` : ''} input`;
  if (kind === 'task') quickAdd(v, f.dataset.date || null);
  else if (kind === 'habit') addHabit(v);
  else if (kind === 'month') { const doc = clone(yearDoc(S.year)); doc.months = doc.months || {}; const m = f.dataset.m; doc.months[m] = [...(doc.months[m] || []), { id: uid('p'), t: v.slice(0, 100), done: false }]; put('years', doc); render(); }
  const again = document.querySelector(sel); if (again) again.focus();
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'set-remind') { S.settings.remind = Number(e.target.value); persistSettings(); }
  else if (id === 'set-start' && RE_TIME.test(e.target.value)) { S.settings.dayStart = e.target.value; persistSettings(); }
  else if (id === 'set-end' && RE_TIME.test(e.target.value)) { S.settings.dayEnd = e.target.value; persistSettings(); }
  else if (id === 'set-nudge' && RE_TIME.test(e.target.value)) { S.settings.nudge = e.target.value; persistSettings(); render(); }
  else if (id === 'cap-file') { addImages(e.target.files); e.target.value = ''; }
  else if (id === 'e-rep') { $('#e-days-wrap').hidden = e.target.value !== 'weekly'; if (e.target.value === 'weekly' && !S.draft.days.length) { const d = $('#e-date').value; S.draft.days = [d ? parseYmd(d).getDay() : new Date().getDay()]; $('#e-days').innerHTML = daysBtns(); } }
  else if (id === 'g-area') $('#g-newarea-wrap').hidden = e.target.value !== '__new';
  else if (id === 'yr-kw' || id === 'yr-vi') { const doc = clone(yearDoc(S.year)); doc.keyword = $('#yr-kw').value.trim().slice(0, 40); doc.vision = $('#yr-vi').value.trim().slice(0, 1000); put('years', doc); toast('Đã lưu.'); }
});
$('#cap-text').addEventListener('paste', e => {
  const files = [...(e.clipboardData && e.clipboardData.files || [])].filter(f => /^image\//.test(f.type));
  if (files.length && AI.sample && AI.images) { addImages(files); if (!e.clipboardData.getData('text')) e.preventDefault(); }
  else if (files.length) toast('Chỗ này chưa đọc được ảnh, hãy dán chữ.');
});
$('#btn-go').addEventListener('click', analyze);
$('#btn-stop').addEventListener('click', () => ctl && ctl.abort());
$('#btn-mic').addEventListener('click', startDictation);
$('#btn-theme').addEventListener('click', () => { const order = ['system', 'light', 'dark']; S.settings.theme = order[(order.indexOf(S.settings.theme) + 1) % 3]; applyTheme(); persistSettings(); if (S.view === 'settings') render(); toast('Giao diện: ' + THEME_LBL[S.settings.theme]); });
let rzT = null; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(drawCharts, 150); });
setInterval(() => { const a = document.activeElement; if (S.view === 'today' && $('#sheet').hidden && !S.loading && !(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) render(); }, 60000);

/* ================= boot ================= */
const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
async function boot() {
  render(); setBusy(false);
  const [dbNs, sample, dict, dl] = await Promise.all([use('db'), use('sample'), use('dictation'), use('downloads')]);
  AI.sample = sample; AI.downloads = dl; AI.dict = dict;
  if (sample) { try { const lim = await sample.limits(); AI.images = !!(lim && lim.images); AI.imgMax = lim && lim.images ? lim.images.maxCount : 0; } catch { AI.images = false; } }
  if (dict) {
    dict.onFinal(({ text }) => { const ta = $('#cap-text'); ta.value = ta.value + (ta.value ? text : text.replace(/^\s+/, '')); });
    dict.onPartial(({ text }) => { const p = $('#cap-partial'); p.hidden = !text; p.textContent = text; });
    dict.onState(({ state }) => { const b = $('#btn-mic'), on = state !== 'idle'; b.classList.toggle('on', on); b.querySelector('span').textContent = on ? 'Dừng nói' : 'Nói'; if (!on) $('#cap-partial').hidden = true; });
  }
  if (dbNs) {
    db = dbNs; S.mode = 'db'; const seen = new Set();
    const timer = setTimeout(() => { if (S.loading) { S.loading = false; updateCaptureUI(); render(); toast('Mạng chậm nên dữ liệu cũ chưa hiện hết. Bạn vẫn ghi việc mới được.'); } }, 10000);
    db.doc('meta/settings').onSnapshot(snap => { if (snap.exists) { S.settings = mergeSettings(snap.data()); applyTheme(); } if (!S.loading) render(); }, () => {});
    COLLS.forEach(c => db.collection(c).onSnapshot(snap => {
      const m = new Map(); snap.docs.forEach(d => { const o = d.data(); if (o && o.id) m.set(o.id, Object.assign({}, o)); }); S[c] = m; seen.add(c);
      if (S.loading && seen.size === COLLS.length) { clearTimeout(timer); S.loading = false; updateCaptureUI(); }
      if (!S.loading) render();
    }, () => { if (S.loading && c === 'tasks') { clearTimeout(timer); S.mode = 'local'; db = null; loadLocal(); S.loading = false; updateCaptureUI(); render(); toast('Không mở được dữ liệu trên tài khoản, đang dùng bộ nhớ của máy này.'); } }));
  } else { S.mode = 'local'; loadLocal(); applyTheme(); S.loading = false; }
  updateCaptureUI(); render();
}
boot();
})();
</script>
