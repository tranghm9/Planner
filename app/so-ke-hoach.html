<title>Sổ Kế Hoạch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow planner column; capture box on top, timeline of the day below; bottom tab bar on phones, top tabs on wide screens. */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --sunken:#F6F8F6; --ink:#16211D; --muted:#5B6964; --line:#D8E0DC;
  --accent:#1D6A5B; --accent-ink:#FFFFFF; --accent-soft:#E0EEE9;
  --mark:#E9A91C; --mark-soft:#FBF0D4; --danger:#B9402C; --danger-soft:#F8E3DE;
  --shadow:0 1px 2px rgba(22,33,29,.06),0 4px 16px rgba(22,33,29,.06);
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#16201D; --sunken:#121B18; --ink:#E4ECE8; --muted:#93A39D; --line:#25332E;
  --accent:#5DC0A6; --accent-ink:#0B1412; --accent-soft:#1A2E28;
  --mark:#F2C14E; --mark-soft:#2E2817; --danger:#EE7B65; --danger-soft:#33201B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#16201D; --sunken:#121B18; --ink:#E4ECE8; --muted:#93A39D; --line:#25332E;
  --accent:#5DC0A6; --accent-ink:#0B1412; --accent-soft:#1A2E28;
  --mark:#F2C14E; --mark-soft:#2E2817; --danger:#EE7B65; --danger-soft:#33201B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-top:18px}
.brand{font-weight:700;font-size:22px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:13px;color:var(--muted);letter-spacing:0}
.meter{min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-end;font-size:12px;color:var(--muted)}
.meter .bar{width:150px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent);border-radius:9px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:6px 2px;border-radius:10px;position:relative}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--mark);color:#2A1E00;font-size:10px;font-weight:700;border-radius:9px;padding:0 5px;min-width:16px}
@media (min-width:760px){
  body{padding-bottom:40px}
  .tabs{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;border:1px solid var(--line);border-radius:var(--r);margin:0;padding:4px;justify-content:flex-start;gap:4px}
  .tabs button{flex:0 0 auto;flex-direction:row;gap:8px;font-size:14px;padding:8px 14px}
  .tabs button svg{width:18px;height:18px}
  .tabs button[aria-current="page"]{background:var(--accent-soft)}
  .tabs .badge{position:static}
}

/* cards & sections */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.sec{display:flex;flex-direction:column;gap:8px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sec-h h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sec-h .count{font-size:13px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.empty{padding:18px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:14px;text-align:center}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* capture */
.cap{display:flex;flex-direction:column;gap:10px}
.cap h1{font-size:18px;font-weight:600}
.cap textarea{width:100%;min-height:92px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--sunken);line-height:1.5}
.cap textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.cap .tools{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;padding:0}
.partial{font-size:13px;color:var(--accent);min-height:0}
.busy{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mic.on{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}

/* task rows */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.task{display:grid;grid-template-columns:auto auto 1fr;align-items:start;gap:10px;padding:11px 14px;border-top:1px solid var(--line);min-width:0}
.task:first-child{border-top:0}
.task.no-when{grid-template-columns:auto 1fr}
.when{font-size:13px;font-weight:600;color:var(--muted);width:44px;padding-top:2px}
.when.soon{color:var(--accent)}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--c,var(--muted));background:none;padding:0;margin-top:1px;display:grid;place-items:center;flex:none}
.check:hover{background:color-mix(in srgb,var(--c,var(--muted)) 18%,transparent)}
.task.done .check{background:var(--c,var(--muted))}
.task.done .check::after{content:"";width:9px;height:5px;border:2px solid var(--surface);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.tbody{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.ttl{font-weight:500;overflow-wrap:anywhere}
.meta{display:flex;gap:6px 10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--ink)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.pill{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:6px}
.pill.high{background:var(--mark-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--mark)}
.pill.late{background:var(--danger-soft);color:var(--danger)}
.pill.auto{background:var(--accent-soft);color:var(--accent)}
.pill.ex{background:var(--sunken);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.notes-snip{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.now{display:flex;align-items:center;gap:8px;padding:2px 14px;font-size:11.5px;font-weight:700;color:var(--mark);background:var(--sunken)}
.now::after{content:"";flex:1;height:2px;background:var(--mark);border-radius:2px}

/* review queue */
.review{border-color:var(--mark);background:linear-gradient(var(--mark-soft),var(--mark-soft)) padding-box}
.rv{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid color-mix(in srgb,var(--mark) 40%,transparent)}
.rv:first-of-type{border-top:0;padding-top:4px}
.rv .why{font-size:12.5px;color:var(--muted)}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choice{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.choice::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.choice.sug{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.choice.sug::after{content:"gợi ý";font-size:10.5px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.choice.new{border-style:dashed}

/* plan preview */
.plan{border-color:var(--accent)}
.plan ol{margin:6px 0 10px;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.plan li span{color:var(--muted);font-size:13px}

/* categories */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cat{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.cat[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.cat .nm{font-weight:600;display:flex;align-items:center;gap:8px}
.cat .nm::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.cat .lv{font-size:12px;color:var(--muted)}
.dots{display:inline-flex;gap:3px;vertical-align:middle;margin-right:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}

/* form / sheet */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,16,14,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .pane{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:760px){.sheet{align-items:center}.sheet .pane{border-radius:18px}}
.sheet h3{font-size:17px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12.5px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--sunken);width:100%;min-width:0}
.f textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set .lbl{min-width:0}
.set .lbl b{display:block;font-weight:600}
.set .lbl span{font-size:13px;color:var(--muted)}
.switch{width:46px;height:28px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:21px}
.guide{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--sunken);border:1px solid var(--line);font-size:13.5px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(92vw,480px);box-shadow:var(--shadow)}
@media (min-width:760px){#toast{bottom:24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Sổ Kế Hoạch<small id="today-line" class="num"></small></div>
    <div class="meter" id="meter"></div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Các trang">
    <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.6" fill="currentColor"/></svg><span>Hôm nay</span><b class="badge" id="badge-review" hidden></b></button>
    <button data-tab="upcoming"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h10M4 18h7"/><path d="m16 15 3 3-3 3"/></svg><span>Sắp tới</span></button>
    <button data-tab="cats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg><span>Danh mục</span></button>
    <button data-tab="done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="m8 12.5 2.7 2.7L16.5 9.5"/></svg><span>Đã xong</span></button>
    <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg><span>Cài đặt</span></button>
  </nav>

  <section class="card cap" id="capture" aria-labelledby="cap-h">
    <h1 id="cap-h">Ghi nhanh mọi thứ cần nhớ</h1>
    <textarea id="cap-text" placeholder="Dán tin nhắn, email, ghi chú… hoặc gõ: &quot;Thứ 6 họp với khách 3h chiều, mai đóng tiền điện&quot;. Có thể dán thẳng ảnh chụp màn hình vào đây."></textarea>
    <div class="partial" id="cap-partial" hidden></div>
    <div class="thumbs" id="thumbs" hidden></div>
    <div class="tools">
      <div class="row">
        <button class="btn mic" id="btn-mic" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg><span>Nói</span></button>
        <label class="btn" id="btn-img" for="cap-file" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m4 17 5-4.5 4 3.5 3-2.5 4 3.5"/></svg><span>Ảnh chụp</span></label>
        <input type="file" id="cap-file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
      </div>
      <div class="row">
        <button class="btn ghost" id="btn-stop" type="button" hidden>Dừng</button>
        <button class="btn primary" id="btn-go" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg><span>Phân loại &amp; lên lịch</span></button>
      </div>
    </div>
    <div class="hint" id="cap-hint"></div>
  </section>

  <main id="view" class="wrap" aria-live="polite"></main>
</div>

<div class="sheet" id="sheet" hidden><div class="pane" id="pane" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" hidden></div>

<script>
(() => {
'use strict';
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const today = () => ymd(new Date());
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const WD = ['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const dmY = d => `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
const uid = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const RE_DATE = /^\d{4}-\d{2}-\d{2}$/, RE_TIME = /^\d{2}:\d{2}$/;
const LEARN_N = 3;
const TZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'Asia/Ho_Chi_Minh'; } catch { return 'Asia/Ho_Chi_Minh'; } })();

/* ---------- lunar calendar (Ho Ngoc Duc's algorithm, UTC+7) ---------- */
function jdFromDate(dd,mm,yy){const a=Math.floor((14-mm)/12),y=yy+4800-a,m=mm+12*a-3;let jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-Math.floor(y/100)+Math.floor(y/400)-32045;if(jd<2299161)jd=dd+Math.floor((153*m+2)/5)+365*y+Math.floor(y/4)-32083;return jd}

function ingest(items, sourceText) {
  let auto = 0, ask = 0;
  for (const it of items) {
    if (!it || typeof it !== 'object') continue;
    const title = String(it.title || '').trim().slice(0, 120); if (!title) continue;
    let cat = String(it.category || ''), newCat = null;
    if (!catById(cat)) { if (cat === 'NEW' && it.newCategoryName) newCat = String(it.newCategoryName).trim().slice(0, 30) || null; cat = catById(it.fallbackCategory) ? it.fallbackCategory : 'other'; }
    const conf = Math.max(0, Math.min(1, Number(it.confidence) || 0));
    const isAuto = !S.settings.alwaysAsk && !newCat && learnedCount(cat) >= LEARN_N && conf >= 0.8;
    const t = newTask({
      title, notes: String(it.notes || '').slice(0, 2000), cat,
      date: RE_DATE.test(it.date || '') ? it.date : null, time: RE_TIME.test(it.time || '') ? it.time : null,
      duration: Math.max(5, Math.min(480, Math.round(Number(it.duration) || 30))),
      remind: Number.isFinite(Number(it.remindMinutes)) ? Math.max(0, Math.min(10080, Math.round(Number(it.remindMinutes)))) : S.settings.remind,
      priority: PRI[it.priority] !== undefined ? it.priority : 'medium',
      repeat: REPEAT_LBL[it.repeat] ? it.repeat : 'none',
      status: isAuto ? 'open' : 'review', auto: isAuto, aiConf: conf, aiReason: String(it.reason || '').slice(0, 200), newCat,
      source: String(sourceText || '').slice(0, 300)
    });
    persistTask(t); isAuto ? auto++ : ask++;

}

  if (/ngày kia|\bmốt\b/.test(x)) date = ymd(addDays(now, 2));

    if (d >= 1 && d <= 31 && m >= 1 && m <= 12) { let c = new Date(y, m-1, d); if (!dm[3] && c < addDays(now, -1)) c = new Date(y+1, m-1, d); date = ymd(c); } }

  for (const c of cats()) { const kw = NORM(c.desc + ' ' + c.name).split(/[,\s/()]+/).filter(w => w.length > 2); const hit = kw.filter(w => words.has(w)).length; if (hit) score[c.id] = Math.max(score[c.id] || 0, Math.min(0.6, 0.25 * hit)); }

/* ---------- plan my day ---------- */
let planCtl = null;
async function planDay() {

  const t = today(), list = openTasks().filter(x => x.date === t || (x.date && x.date < t));
  const fixed = list.filter(x => x.date === t && x.time), loose = list.filter(x => !(x.date === t && x.time));
  if (!loose.length) { toast('Các việc hôm nay đã có giờ cả rồi.'); return; }
  S.plan = { loading: true }; render();
  planCtl = new AbortController();
  const prompt = `Bạn giúp một người Việt Nam xếp lịch trong ngày. Bây giờ là ${nowHM()}, ${WD[new Date().getDay()]} ${dmY(new Date())}. Ngày làm việc của họ từ ${S.settings.dayStart} đến ${S.settings.dayEnd}.

VIỆC ĐÃ CÓ GIỜ CỐ ĐỊNH (không được đổi, không xếp chồng lên):
${fixed.map(x => `- ${x.time}, ${x.duration || 30} phút: ${x.title}`).join('\n') || '(không có)'}

VIỆC CẦN XẾP GIỜ:
${loose.map(x => `- id=${x.id} | ${x.title} | danh mục: ${catOf(x).name} | ưu tiên: ${x.priority}${x.date < t ? ' | đã quá hạn' : ''}${x.duration ? ' | khoảng ' + x.duration + ' phút' : ''}`).join('\n')}

QUY TẮC: chỉ xếp sau thời điểm hiện tại; việc ưu tiên cao và việc quá hạn làm trước; gom các việc cùng danh mục gần nhau; chừa 10 phút nghỉ giữa các việc; nếu không đủ thời gian thì chuyển việc ít quan trọng sang ngày mai (moveToTomorrow: true).
Trả lời CHỈ bằng JSON: {"plan":[{"id":"","time":"HH:MM","minutes":30,"moveToTomorrow":false,"why":"lý do ngắn"}],"tip":"một câu khuyên ngắn, thân thiện"}`;
  try {
    const out = await AI.sample.json(prompt, { signal: planCtl.signal, modelTier: 'default', cache: false });
    const rows = (Array.isArray(out && out.plan) ? out.plan : []).filter(r => r && S.tasks.has(String(r.id)));
    if (!rows.length) { S.plan = null; toast('AI chưa xếp được, bấm thử lại nhé.'); }
    else S.plan = { rows: rows.map(r => ({ id: String(r.id), time: RE_TIME.test(r.time || '') ? r.time : null, minutes: Math.max(5, Math.min(480, Math.round(Number(r.minutes) || 30))), tomorrow: !!r.moveToTomorrow, why: String(r.why || '').slice(0, 140) })), tip: String(out.tip || '').slice(0, 200) };

  planCtl = null; render();
}
function applyPlan() {
  if (!S.plan || !S.plan.rows) return; const t = today(), tm = ymd(addDays(new Date(), 1));

    if (r.tomorrow) { x.date = tm; } else if (r.time) { x.date = t; x.time = r.time; x.duration = r.minutes; }

/* ---------- calendar export ---------- */
const fmtLocal = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
const RR = { daily: 'DAILY', weekly: 'WEEKLY', monthly: 'MONTHLY' };
function startOf(t) { const s = parseYmd(t.date); if (t.time) { const [h, m] = t.time.split(':').map(Number); s.setHours(h, m, 0, 0); } return s; }
function gcalUrl(t) {
  const p = new URLSearchParams({ action: 'TEMPLATE', text: t.title });
  if (t.date) {
    if (t.time) { const s = startOf(t), e = new Date(s.getTime() + (t.duration || 30) * 60000); p.set('dates', fmtLocal(s) + '/' + fmtLocal(e)); p.set('ctz', TZ); }
    else p.set('dates', t.date.replace(/-/g, '') + '/' + ymd(addDays(parseYmd(t.date), 1)).replace(/-/g, ''));
  }
  p.set('details', (t.notes ? t.notes + '\n\n' : '') + 'Danh mục: ' + catOf(t).name + (t.remind ? `\nNên nhắc trước ${t.remind} phút` : ''));
  if (RR[t.repeat]) p.set('recur', 'RRULE:FREQ=' + RR[t.repeat]);
  return 'https://calendar.google.com/calendar/render?' + p.toString();
}
const icsEsc = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
const fold = line => { const out = []; let s = line; while (s.length > 60) { out.push(s.slice(0, 60)); s = ' ' + s.slice(60); } out.push(s); return out.join('\r\n'); };
function buildIcs(list) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//So Ke Hoach//VI', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Sổ Kế Hoạch'];
  for (const t of list) {
    if (!t.date) continue;
    L.push('BEGIN:VEVENT', 'UID:' + t.id + '@so-ke-hoach', 'DTSTAMP:' + stamp);
    if (t.time) { const s = startOf(t), e = new Date(s.getTime() + (t.duration || 30) * 60000); L.push('DTSTART:' + fmtLocal(s), 'DTEND:' + fmtLocal(e)); }
    else L.push('DTSTART;VALUE=DATE:' + t.date.replace(/-/g, ''), 'DTEND;VALUE=DATE:' + ymd(addDays(parseYmd(t.date), 1)).replace(/-/g, ''));
    L.push('SUMMARY:' + icsEsc(t.title), 'DESCRIPTION:' + icsEsc((t.notes ? t.notes + '\n' : '') + 'Danh mục: ' + catOf(t).name), 'CATEGORIES:' + icsEsc(catOf(t).name));
    if (RR[t.repeat]) L.push('RRULE:FREQ=' + RR[t.repeat]);
    L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(t.title), 'TRIGGER:' + (t.time ? `-PT${Math.max(0, t.remind || 0)}M` : 'PT8H'), 'END:VALARM', 'END:VEVENT');
  }

}

  try { await AI.downloads.save({ filename: name, data: buildIcs(dated) }); toast('Đã lưu. Mở file để thêm nhắc hẹn vào lịch điện thoại.'); }

function saveEdit(form) {

let toastTimer = null;

document.addEventListener('click', e => {
  const tabBtn = e.target.closest('#tabs button'); if (tabBtn) { S.tab = tabBtn.dataset.tab; S.plan = S.plan && S.plan.loading ? S.plan : null; render(); window.scrollTo(0, 0); return; }
  const go = e.target.closest('[data-tab-go]'); if (go) { S.tab = go.dataset.tabGo; render(); window.scrollTo(0, 0); return; }

  const act = el.dataset.act, host = el.closest('[data-id]'), id = host && host.dataset.id;
  if (act !== 'del') S.confirmDel = null; if (act !== 'forget') S.confirmForget = false; if (act !== 'cat-del') S.confirmCatDel = null;
  switch (act) {
    case 'done': toggleDone(id); break;
    case 'edit': editTask(id); break;
    case 'close': closeSheet(); break;
    case 'del': if (S.confirmDel === id) { removeTask(id); S.confirmDel = null; closeSheet(); render(); toast('Đã xóa.'); } else { S.confirmDel = id; el.textContent = 'Bấm lần nữa để xóa'; } break;
    case 'confirm': { const t = S.tasks.get(id); if (!t) break; t.cat = el.dataset.cat; t.status = 'open'; t.auto = false; t.newCat = null; learn(t.title + ' ' + t.notes, t.cat); persistTask(t);
      const n = learnedCount(t.cat); toast(n === LEARN_N ? `App đã hiểu nhóm “${catOf(t).name}”. Từ giờ sẽ tự xếp việc tương tự.` : `Đã xếp vào “${catOf(t).name}”.`); render(); break; }
    case 'confirm-new': { const t = S.tasks.get(id); if (!t || !t.newCat) break; const c = addCategory(t.newCat); if (!c) break; t.cat = c.id; t.status = 'open'; t.auto = false; t.newCat = null; learn(t.title + ' ' + t.notes, c.id); persistTask(t); toast(`Đã tạo danh mục “${c.name}”.`); render(); break; }
    case 'discard': removeTask(id); render(); break;
    case 'rm-img': { const k = +el.dataset.i; const it = S.images[k]; if (it) URL.revokeObjectURL(it.url); S.images.splice(k, 1); renderThumbs(); break; }
    case 'welcomed': S.settings.welcomed = true; persistSettings(); render(); break;
    case 'clear-ex': [...S.tasks.values()].filter(t => t.isExample).forEach(t => removeTask(t.id)); render(); toast('Đã xóa các ví dụ.'); break;
    case 'move-overdue': { const t = today(); openTasks().filter(x => x.date && x.date < t).forEach(x => { x.date = t; persistTask(x); }); render(); toast('Đã dời sang hôm nay.'); break; }
    case 'plan': planDay(); break;
    case 'plan-stop': if (planCtl) planCtl.abort(); break;
    case 'plan-apply': applyPlan(); break;
    case 'plan-cancel': S.plan = null; render(); break;
    case 'cat': S.catFilter = S.catFilter === el.dataset.cat ? null : el.dataset.cat; render(); break;
    case 'cat-new': editCategory(null); break;

      [...S.tasks.values()].filter(t => t.cat === cid).forEach(t => { t.cat = 'other'; persistTask(t); });
      S.settings.categories = cats().filter(c => c.id !== cid); S.settings.examples = S.settings.examples.filter(x => x.c !== cid); delete S.settings.stats[cid];

    case 'toggle-ask': S.settings.alwaysAsk = !S.settings.alwaysAsk; persistSettings(); render(); break;
    case 'forget': if (!S.confirmForget) { S.confirmForget = true; el.textContent = 'Bấm lần nữa để xóa'; } else { S.settings.examples = []; S.settings.stats = {}; S.confirmForget = false; persistSettings(); render(); toast('App đã quên các lựa chọn cũ và sẽ hỏi lại bạn.'); } break;

  }

/* ---------- boot ---------- */
const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
async function boot() {
  render(); setBusy(false);
  const [dbNs, sample, dict, dl] = await Promise.all([use('db'), use('sample'), use('dictation'), use('downloads')]);
  AI.sample = sample; AI.downloads = dl; AI.dict = dict;
  if (sample) { try { const lim = await sample.limits(); AI.images = !!(lim && lim.images); AI.imgMax = lim && lim.images ? lim.images.maxCount : 0; } catch { AI.images = false; } }
  if (dict) {
    dict.onFinal(({ text }) => { const ta = $('#cap-text'); ta.value = (ta.value ? ta.value : '') + (ta.value ? text : text.replace(/^\s+/, '')); });
    dict.onPartial(({ text }) => { const p = $('#cap-partial'); p.hidden = !text; p.textContent = text; });
    dict.onState(({ state }) => { const b = $('#btn-mic'); const on = state !== 'idle'; b.classList.toggle('on', on); b.querySelector('span').textContent = on ? 'Dừng nói' : 'Nói'; if (!on) $('#cap-partial').hidden = true; });
  }
  if (dbNs) {
    db = dbNs; S.mode = 'db';
    const timer = setTimeout(() => { if (S.loading) { S.loading = false; S.loadNote = ''; updateCaptureUI(); render(); toast('Mạng chậm nên dữ liệu cũ chưa hiện hết. Bạn vẫn ghi việc mới được.'); } }, 10000);
    db.doc('meta/settings').onSnapshot(snap => { S.settings = mergeSettings(snap.exists ? snap.data() : null); if (!S.loading) render(); }, () => {});
    db.collection('tasks').onSnapshot(snap => {
      if (!snap.metadata.fromCache) clearTimeout(timer);
      const m = new Map(); snap.docs.forEach(d => { const o = d.data(); if (o && o.id) m.set(o.id, Object.assign({}, o)); });
      S.tasks = m; if (S.loading) { S.loading = false; updateCaptureUI(); } render();
    }, () => { clearTimeout(timer); if (S.loading) { S.mode = 'local'; db = null; loadLocal(); S.loading = false; updateCaptureUI(); render(); toast('Không mở được dữ liệu trên tài khoản, đang dùng bộ nhớ của máy này.'); } });
  } else { S.mode = 'local'; loadLocal(); S.loading = false; }
  updateCaptureUI(); render();
}
boot();
})();
</script>
